<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Financeiro PWA</title>
</head>
<body>
  <main class="app shell">
    <header class="hero card">
      <div>
        <p class="eyebrow">Controle financeiro</p>
        <h1>Receitas e despesas</h1>
        <p class="subtitle">Adicione seus lançamentos e acompanhe seu saldo no celular Android.</p>
      </div>
      <button id="installBtn" class="btn btn-secondary hidden" type="button">Instalar app</button>
    </header>

    <section class="grid stats">
      <article class="card stat">
        <span>Saldo</span>
        <strong id="saldo">R$ 0,00</strong>
      </article>
      <article class="card stat">
        <span>Receitas</span>
        <strong id="receitas">R$ 0,00</strong>
      </article>
      <article class="card stat">
        <span>Despesas</span>
        <strong id="despesas">R$ 0,00</strong>
      </article>
    </section>

    <section class="card form-card">
      <h2>Novo lançamento</h2>
      <form id="transactionForm" class="form">
        <label>
          Tipo
          <select id="type" required>
            <option value="income">Receita</option>
            <option value="expense">Despesa</option>
          </select>
        </label>
        <label>
          Descrição
          <input id="description" type="text" maxlength="60" placeholder="Ex.: salário, mercado..." required />
        </label>
        <label>
          Valor
          <input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00" required />
        </label>
        <label>
          Data
          <input id="date" type="date" required />
        </label>
        <button class="btn btn-primary" type="submit">Adicionar</button>
      </form>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <h2>Lançamentos</h2>
        <button id="clearBtn" class="btn btn-ghost" type="button">Limpar tudo</button>
      </div>
      <ul id="transactions" class="transactions" aria-live="polite"></ul>
      <p id="emptyState" class="empty hidden">Nenhum lançamento ainda.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
